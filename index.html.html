<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keystroke – typing speed test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ebe8f6; --card:#f8f6fd; --ink:#231a3b; --mute:#6d6389; --line:#d3cde6;
  --accent:#e8501a; --on-accent:#fff; --bad:#c4204a; --badbg:#f8d7e0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16112b; --card:#211a3d; --ink:#ece8fb; --mute:#a69dc6; --line:#38305a;
    --accent:#ff8a4d; --on-accent:#16112b; --bad:#ff7a9a; --badbg:#4a1f38; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16112b; --card:#211a3d; --ink:#ece8fb; --mute:#a69dc6; --line:#38305a;
  --accent:#ff8a4d; --on-accent:#16112b; --bad:#ff7a9a; --badbg:#4a1f38; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;margin:0}
.seg{display:flex;gap:6px}
.seg button{font:inherit;padding:7px 16px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.live{display:flex;gap:32px;margin-bottom:14px;align-items:flex-end}
.live div{min-width:70px}
.live b{display:block;font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.live span{color:var(--mute);font-size:.9rem}
#left{color:var(--accent)}
.box{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;cursor:text}
.box:focus-within{border-color:var(--accent)}
#text{font-family:"Courier Prime","Courier New",monospace;font-size:clamp(1.25rem,3.4vw,1.7rem);line-height:2.1rem;
  height:6.3rem;overflow:hidden;color:var(--mute);user-select:none;-webkit-user-select:none}
#text span.ok{color:var(--ink)}
#text span.bad{color:var(--bad);background:var(--badbg);border-radius:3px}
#text span.cur{box-shadow:-2px 0 0 var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{box-shadow:-2px 0 0 transparent}}
@media (prefers-reduced-motion:reduce){#text span.cur{animation:none}}
#inp{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;cursor:text}
.hint{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--mute);font-size:.95rem;gap:12px;flex-wrap:wrap}
.hint button{font:inherit;font-weight:600;padding:8px 18px;border-radius:8px;border:0;background:var(--accent);color:var(--on-accent);cursor:pointer}
#result{display:none;margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
#result.show{display:block}
#result h2{margin:0 0 14px;font-size:1.1rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px;margin-bottom:18px}
.stats b{display:block;font-size:2.2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{color:var(--mute);font-size:.9rem}
.stats .main b{color:var(--accent);font-size:3.4rem}
svg{width:100%;height:auto;display:block}
.line{stroke:var(--accent);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.axis{stroke:var(--line);stroke-width:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Keystroke</h1>
    <div class="seg" id="durs" role="group" aria-label="Test length"></div>
  </header>

  <div class="live" aria-live="off">
    <div><b id="left">30</b><span>seconds left</span></div>
    <div><b id="wpm">0</b><span>words per minute</span></div>
    <div><b id="acc">100%</b><span>accuracy</span></div>
  </div>

  <div class="box" id="box">
    <div id="text" aria-hidden="true"></div>
    <input id="inp" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Type the text shown above">
  </div>

  <div class="hint">
    <span id="hintTxt">Click the text and start typing. The timer begins on your first key.</span>
    <button id="restart" type="button">New test</button>
  </div>

  <section id="result" aria-live="polite">
    <h2 id="rTitle">Your result</h2>
    <div class="stats">
      <div class="main"><b id="rWpm">0</b><span>words per minute</span></div>
      <div><b id="rAcc">0%</b><span>accuracy</span></div>
      <div><b id="rChars">0</b><span>correct characters</span></div>
      <div><b id="rBest">0</b><span>best at this length</span></div>
    </div>
    <svg viewBox="0 0 400 100" id="spark" role="img" aria-label="Speed over time"></svg>
  </section>
</div>

<script>
(function(){
  var WORDS = ("the of and to in is you that it he was for on are as with his they at be this from have or by one had not but what all were when we there can an your which their said if do will each about how up out them then she many some so these would other into has more her two like him see time could no make than first been its who now people my made over did down only way find use may water long little very after words called just where most know brew paper river stone light green quick think small world bright morning window garden pencil copper silver mountain simple travel music clock sugar thread ocean").split(" ");
  var $ = function(id){ return document.getElementById(id); };
  var box=$("box"), inp=$("inp"), textEl=$("text");
  var st = {dur:30, text:"", spans:[], started:false, ended:false, t0:0, tot:0, ok:0, samples:[], timer:null};

  function gen(n){ var a=[]; for(var i=0;i<n;i++) a.push(WORDS[Math.floor(Math.random()*WORDS.length)]); return a.join(" "); }

  function build(){
    textEl.innerHTML=""; st.spans=[];
    for(var i=0;i<st.text.length;i++){
      var s=document.createElement("span"); s.textContent=st.text[i]; textEl.appendChild(s); st.spans.push(s);
    }
  }
  function append(){
    var more=" "+gen(40);
    for(var i=0;i<more.length;i++){
      var s=document.createElement("span"); s.textContent=more[i]; textEl.appendChild(s); st.spans.push(s);
    }
    st.text+=more;
  }
  function correctCount(v){ var c=0; for(var i=0;i<v.length;i++) if(v[i]===st.text[i]) c++; return c; }

  function paint(){
    var v=inp.value;
    for(var i=0;i<st.spans.length;i++){
      var c = i<v.length ? (v[i]===st.text[i] ? "ok" : "bad") : (i===v.length ? "cur" : "");
      if(st.spans[i].className!==c) st.spans[i].className=c;
    }
    var cur=st.spans[v.length];
    if(cur){
      var line=cur.offsetTop, lh=parseFloat(getComputedStyle(textEl).lineHeight);
      textEl.scrollTop=Math.max(0, line-lh);
    }
  }
  function elapsed(){ return (Date.now()-st.t0)/1000; }
  function liveStats(){
    var e=Math.max(elapsed(),1), w=Math.round(correctCount(inp.value)/5/(e/60));
    $("wpm").textContent=w;
    $("acc").textContent=(st.tot?Math.round(st.ok/st.tot*100):100)+"%";
    return w;
  }
  function tick(){
    var e=elapsed(), left=Math.max(0,Math.ceil(st.dur-e));
    $("left").textContent=left;
    var w=liveStats();
    if(Math.floor(e)>st.samples.length) st.samples.push(w);
    if(e>=st.dur) finish();
  }
  function finish(){
    if(st.ended) return;
    st.ended=true; clearInterval(st.timer); inp.blur(); inp.disabled=true;
    var c=correctCount(inp.value), w=Math.round(c/5/(st.dur/60));
    var acc=st.tot?Math.round(st.ok/st.tot*100):100;
    var key="keystroke-best-"+st.dur, best=0;
    try{ best=+localStorage.getItem(key)||0; if(w>best){ best=w; localStorage.setItem(key,String(w)); } }catch(e){ best=Math.max(best,w); }
    $("rWpm").textContent=w; $("rAcc").textContent=acc+"%"; $("rChars").textContent=c; $("rBest").textContent=best;
    $("rTitle").textContent = w>=best && w>0 ? "New best at "+st.dur+" seconds" : "Your result";
    drawSpark(); $("result").className="show";
    $("hintTxt").textContent="Press New test or Esc to go again.";
    $("result").scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  function drawSpark(){
    var s=st.samples.length?st.samples:[0], max=Math.max.apply(null,s.concat([10]))*1.15, n=s.length, pts=[];
    for(var i=0;i<n;i++){ pts.push((n===1?200:10+i*(380/(n-1))).toFixed(1)+","+(90-s[i]/max*80).toFixed(1)); }
    $("spark").innerHTML='<line class="axis" x1="10" y1="90" x2="390" y2="90"/><polyline class="line" points="'+pts.join(" ")+'"/>';
  }
  function reset(){
    clearInterval(st.timer);
    st.text=gen(60); st.started=false; st.ended=false; st.tot=0; st.ok=0; st.samples=[];
    inp.disabled=false; inp.value="";
    build(); paint();
    $("left").textContent=st.dur; $("wpm").textContent="0"; $("acc").textContent="100%";
    $("result").className=""; $("hintTxt").textContent="Click the text and start typing. The timer begins on your first key.";
    textEl.scrollTop=0; inp.focus();
  }

  inp.addEventListener("input", function(e){
    if(st.ended) return;
    if(!st.started){ st.started=true; st.t0=Date.now(); st.timer=setInterval(tick,200); }
    if(e.inputType==="insertText" && e.data){
      var pos=inp.value.length-1; st.tot++; if(e.data===st.text[pos]) st.ok++;
    }
    if(inp.value.length>st.text.length-30) append();
    paint(); liveStats();
  });
  box.addEventListener("click", function(){ if(!st.ended) inp.focus(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ e.preventDefault(); reset(); } });
  $("restart").onclick=reset;

  var durs=$("durs");
  [30,60].forEach(function(d){
    var b=document.createElement("button"); b.type="button"; b.textContent=d+" s";
    b.setAttribute("aria-pressed", d===st.dur);
    b.onclick=function(){
      st.dur=d; Array.prototype.forEach.call(durs.children,function(x){ x.setAttribute("aria-pressed", x===b); });
      reset();
    };
    durs.appendChild(b);
  });
  reset();
})();
</script>
</body>
</html>
